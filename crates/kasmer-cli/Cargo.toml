[package]
name = "kasmer-cli"
version = "0.1.0"
description = "Command line for kasmer: parametric tests of MultiversX smart contracts on the K semantics"
edition.workspace = true
repository.workspace = true
publish.workspace = true

# A working name, while the Python `kasmer` is still around.
[[bin]]
name = "kasmer-rs"
path = "src/main.rs"

[dependencies]
kasmer = { path = "../kasmer" }
kore = { path = "../kore" }
kcfg = { path = "../kcfg" }
kore-rpc = { path = "../kore-rpc" }
clap = { version = "4.6.9", features = ["derive", "env"] }
